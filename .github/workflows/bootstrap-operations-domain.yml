name: Bootstrap operations domain

on:
  push:
    branches:
      - feature/operational-domain-ledger

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Reconstruct source archive
        run: |
          cat .bootstrap/operations-domain.tar.gz.b64.part-* \
            | base64 --decode > /tmp/operations-domain.tar.gz
          tar -xzf /tmp/operations-domain.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-operations-domain.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Format and lint
        run: |
          ruff check --fix .
          ruff format .
          ruff check .

      - name: Generate migration
        run: python manage.py makemigrations operations --noinput

      - name: Validate migrations and tests
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          pytest

      - name: Commit validated domain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E002: add operational domain ledger"
          git push origin "HEAD:${GITHUB_REF_NAME}"
