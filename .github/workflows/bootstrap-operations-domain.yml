name: Bootstrap operations domain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/operational-domain-ledger

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Reconstruct source archive
        run: |
          cat .bootstrap/operations-domain.tar.gz.b64.part-* \
            | base64 --decode > /tmp/operations-domain.tar.gz
          tar -xzf /tmp/operations-domain.tar.gz -C .
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_operations_domain.py")
          content = path.read_text(encoding="utf-8")
          content = content.replace(
              'match="over-allocate"',
              'match="allocate more partner cash"',
          )
          path.write_text(content, encoding="utf-8")
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-operations-domain.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Format and lint
        run: |
          ruff check --fix .
          ruff format .
          ruff check .

      - name: Generate migration
        run: python manage.py makemigrations operations --noinput

      - name: Validate migrations and tests
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          pytest

      - name: Commit validated domain
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E002: add operational domain ledger"
          git push origin "HEAD:${TARGET_BRANCH}"
