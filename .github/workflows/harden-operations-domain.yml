name: Harden operations domain

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/operational-domain-ledger

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0

      - name: Apply invariant hardening
        run: |
          python .bootstrap/harden_operational_domain.py
          rm -rf .bootstrap
          rm -f .github/workflows/harden-operations-domain.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Format and lint source
        run: |
          ruff check --fix .
          ruff format .
          ruff check .

      - name: Generate migration
        run: python manage.py makemigrations operations --noinput

      - name: Validate schema and tests
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py migrate --noinput
          pytest

      - name: Commit validated hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "E002: harden operational ledger invariants"
          git push origin "HEAD:${TARGET_BRANCH}"
